<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background with border -->
  <rect x="10" y="10" width="580" height="380" fill="#f5f5f0" stroke="#9b2226" stroke-width="8"/>
  <rect x="25" y="25" width="550" height="350" fill="none" stroke="#9b2226" stroke-width="2"/>
  
  <!-- Left evergreen tree -->
  <path d="M90,320 L70,200 L110,200 Z" fill="#1b4332"/>
  <path d="M90,240 L60,140 L120,140 Z" fill="#1b4332"/>
  <path d="M90,160 L70,80 L110,80 Z" fill="#1b4332"/>
  <rect x="85" y="320" width="10" height="30" fill="#1b4332"/>
  
  <!-- Right evergreen tree -->
  <path d="M510,320 L490,200 L530,200 Z" fill="#1b4332"/>
  <path d="M510,240 L480,140 L540,140 Z" fill="#1b4332"/>
  <path d="M510,160 L490,80 L530,80 Z" fill="#1b4332"/>
  <rect x="505" y="320" width="10" height="30" fill="#1b4332"/>
  
  <!-- Smaller right evergreen tree -->
  <path d="M560,280 L545,200 L575,200 Z" fill="#1b4332"/>
  <path d="M560,220 L540,150 L580,150 Z" fill="#1b4332"/>
  <rect x="557" y="280" width="6" height="20" fill="#1b4332"/>
  
  <!-- Text: ROY'S CHRISTMAS TREES (arched) -->
  <path id="curve" d="M100,140 C100,80 500,80 500,140" fill="transparent"/>
  <text font-family="Times New Roman, serif" font-weight="bold" font-size="48" fill="#2a2a2a">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">ROY'S CHRISTMAS TREES</textPath>
  </text>
  
  <!-- Text: HOME GROWN -->
  <text x="300" y="200" font-family="Times New Roman, serif" font-size="24" text-anchor="middle" fill="#2a2a2a">HOME GROWN</text>
  
  <!-- Text: HUMBOLDT CO, TREES -->
  <text x="300" y="235" font-family="Times New Roman, serif" font-size="24" text-anchor="middle" fill="#2a2a2a">HUMBOLDT CO, TREES</text>
  
  <!-- Text: SINCE 1982 -->
  <text x="300" y="270" font-family="Times New Roman, serif" font-size="24" text-anchor="middle" fill="#2a2a2a">SINCE 1982</text>
</svg>
